<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>단어콕 · 독립형</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#20243b;background:#f4f6fc}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;padding:22px 16px 50px}h1{margin:0;font-size:30px}h2{font-size:21px}.sub{color:#697189;margin:5px 0 22px}.card{background:white;border:1px solid #e5e9f4;border-radius:22px;padding:20px;margin:12px 0;box-shadow:0 3px 14px #17224c0a}button,.filebtn{border:0;border-radius:14px;background:#e8edff;color:#2c448c;font-weight:700;padding:15px;cursor:pointer;font-size:16px;display:inline-block;text-align:center}button.primary,.filebtn.primary{background:#435bd8;color:white}button.danger{background:#fff0f0;color:#a22}button:disabled{opacity:.45}.full{width:100%;margin:5px 0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}input,textarea{width:100%;border:1px solid #d8deeb;border-radius:13px;padding:14px;font:inherit;background:white}textarea{min-height:120px}label{display:block;margin:12px 0 5px;font-weight:650}.hidden{display:none!important}.word{font-size:30px;font-weight:800;text-align:center;margin:25px 0}.muted{color:#6b7289;font-size:14px}.good{color:#16834c}.bad{color:#bd3c44}.pill{border-radius:50px;padding:7px 12px;background:#e8edff;font-size:13px}.listitem{padding:12px 0;border-bottom:1px solid #edf0f7}.listitem:last-child{border:0}.space{height:10px}.progress{height:9px;background:#e6eafa;border-radius:20px;overflow:hidden}.progress>div{height:100%;background:#435bd8;width:0}.notice{padding:12px;background:#fff6db;border-radius:12px;font-size:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}#quizAnswer{font-size:24px;text-align:center}#feedback{text-align:center;font-size:19px}#quizCard{min-height:180px;display:flex;flex-direction:column;justify-content:center}small{font-size:12px}a{color:#435bd8}</style></head><body><main class="app"><header class="top"><div><h1>📘 단어콕</h1><div class="sub">설치·로그인·배포 없이 사용하는 단어 퀴즈</div></div><span class="pill">독립형 1.0</span></header><section id="home"><div class="card"><h2>단어장 불러오기</h2><label class="filebtn primary full">📂 JSON 파일 선택<input id="jsonFile" type="file" accept=".json,application/json" hidden></label><p class="muted">기존 단어콕 JSON 단어장과 간단한 단어 목록을 불러올 수 있어요.</p><button class="full" id="manualBtn">✍️ 직접 단어 입력</button><button class="full" id="sampleBtn">🧪 예제 단어장 사용</button></div><div id="bookList"></div><div class="card"><h2>데이터 보관</h2><p class="muted">단어장은 이 브라우저에 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우면 사라질 수 있으니 JSON으로 백업하세요.</p><button class="full" id="backupBtn">전체 단어장 백업</button></div></section><section id="editor" class="hidden"><div class="top"><h2>단어장 편집</h2><button id="editorBack">← 목록</button></div><label>단어장 이름</label><input id="bookTitle" placeholder="예: 11월 영어 단어"><label>단어 입력 (한 줄에 하나씩)</label><textarea id="wordLines" placeholder="apple = 사과&#10;attentive = 주의 깊은&#10;consider = 고려하다"></textarea><p class="muted">영어 = 한국어 또는 영어 [탭] 한국어 형식</p><div class="row"><button id="saveBook" class="primary">저장</button><button id="startFromEdit">퀴즈 시작</button></div><div id="editMsg" class="muted"></div></section><section id="quiz" class="hidden"><div class="top"><button id="quizExit">← 나가기</button><span id="quizCount" class="pill"></span><button id="autoBtn">🔊 자동 ON</button></div><div class="progress"><div id="progressBar"></div></div><div id="quizCard" class="card"><div class="muted" style="text-align:center">뜻을 보고 영어로 입력하세요</div><div class="word" id="quizMeaning"></div></div><form id="answerForm"><input id="quizAnswer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="영어 단어 입력" required><button class="primary full" id="submitBtn" type="submit">정답 확인</button></form><div id="feedback" class="card hidden"><div id="answerResult"></div><div id="correctWord"></div><button id="replayBtn" class="full">🔊 다시 듣기</button><button id="nextBtn" class="primary full">다음 →</button><div id="speechMessage" class="muted"></div></div></section><section id="result" class="hidden"><div class="card" style="text-align:center"><h2>🎉 퀴즈 완료</h2><div id="resultText" class="word"></div><button id="retryBtn" class="primary full">다시 풀기</button><button id="resultHome" class="full">단어장 목록</button></div></section><footer class="muted" style="text-align:center;margin-top:25px">단어콕 독립형 · 인터넷 연결 없이 기본 퀴즈 이용 가능<br>영어 발음은 기기의 음성 합성 지원에 따라 달라집니다.</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),KEY='wordkok_standalone_books_v1';let books=[],editing=null,quiz=[],idx=0,miss=[],correct=0,feedback=false,auto=true,activeWord='',voice=null,utterance=null;const id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);const norm=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,'');const safe=s=>String(s??'').trim();function show(page){['home','editor','quiz','result'].forEach(x=>$(x).classList.toggle('hidden',x!==page));window.scrollTo(0,0)}function load(){try{books=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(books))books=[]}catch{books=[]}render()}function persist(){try{localStorage.setItem(KEY,JSON.stringify(books))}catch{alert('저장 공간이 부족합니다. JSON 백업을 해주세요.')}}function escape(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){const target=$('bookList');target.innerHTML=books.length?'<h2>내 단어장</h2>':'<p class="muted">저장된 단어장이 없어요.</p>';books.forEach(b=>{let d=document.createElement('div');d.className='card';d.innerHTML=`<div class="top"><div><b>${escape(b.title)}</b><p class="muted">${b.words.length}개 단어</p></div></div><div class="row"><button class="primary" data-act="quiz">퀴즈</button><button data-act="edit">편집</button><button data-act="export">내보내기</button><button class="danger" data-act="delete">삭제</button></div>`;d.addEventListener('click',e=>{const a=e.target.dataset.act;if(a==='quiz')start(b.words);if(a==='edit')edit(b);if(a==='export')download(b.title+'.json',{format:'wordkok-standalone',book:b});if(a==='delete'&&confirm('이 단어장을 삭제할까요?')){books=books.filter(x=>x.id!==b.id);persist();render()}});target.appendChild(d)})}function parseLines(s){return s.split(/\r?\n/).map(line=>{let parts=line.split(/\s*\t\s*|\s+[=：:]\s+/);return {en:safe(parts.shift()),ko:safe(parts.join(' / '))}}).filter(w=>w.en&&w.ko)}function edit(b){editing=b?.id||null;$('bookTitle').value=b?.title||'';$('wordLines').value=(b?.words||[]).map(w=>`${w.en} = ${w.ko}`).join('\n');$('editMsg').textContent='';show('editor')}function save(){let words=parseLines($('wordLines').value),title=safe($('bookTitle').value)||'새 단어장';if(!words.length){$('editMsg').textContent='영어와 뜻을 입력해주세요.';return null}let b=books.find(x=>x.id===editing);if(b){b.title=title;b.words=words}else{b={id:id(),title,words};books.unshift(b);editing=b.id}persist();render();$('editMsg').textContent=`${words.length}개 단어 저장 완료`;return b}function download(name,obj){const url=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=name.replace(/[\\/:*?"<>|]/g,'_');a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function readWords(x){if(!Array.isArray(x))return[];return x.map(w=>typeof w==='string'?null:{en:safe(w.en??w.english??w.word??w.term),ko:safe(w.ko??w.korean??w.meaning??w.definition??(Array.isArray(w.senses)?w.senses.map(s=>s.meaning??s.ko??s.gloss??'').filter(Boolean).join(', '):''))}).filter(w=>w&&w.en&&w.ko)}function importData(j){let candidates=[];if(Array.isArray(j))candidates=[{title:'가져온 단어장',words:j}];else if(Array.isArray(j.books))candidates=j.books;else if(j.book)candidates=[j.book];else if(Array.isArray(j.words))candidates=[j];else if(Array.isArray(j.vocabulary))candidates=[{title:j.title,words:j.vocabulary}];let added=0;for(let b of candidates){let words=readWords(b.words);if(!words.length)continue;books.unshift({id:id(),title:safe(b.title??b.name)||'가져온 단어장',words});added++}if(!added)throw Error('단어를 찾지 못했어요. JSON 형식을 확인해 주세요.');persist();render();alert(`${added}개 단어장을 가져왔어요.`)}function voices(){if(!('speechSynthesis'in window))return;let vs=speechSynthesis.getVoices();voice=vs.find(v=>v.lang==='en-US'&&v.localService)||vs.find(v=>v.lang==='en-US')||vs.find(v=>v.lang.startsWith('en'))||null}function speak(s){const msg=$('speechMessage');msg.textContent='';if(!('speechSynthesis'in window)){msg.textContent='이 브라우저에서는 음성 기능을 지원하지 않아요.';return}try{speechSynthesis.cancel();voices();const u=new SpeechSynthesisUtterance(s);utterance=u;u.lang='en-US';if(voice)u.voice=voice;u.rate=.85;u.volume=1;u.onerror=e=>{if(!['canceled','interrupted'].includes(e.error))msg.textContent='소리가 나지 않으면 iPhone 무음 모드를 해제하고 Safari에서 다시 듣기를 눌러보세요.'};u.onend=()=>{if(utterance===u)utterance=null};speechSynthesis.speak(u);if(speechSynthesis.paused)speechSynthesis.resume()}catch{msg.textContent='발음을 재생할 수 없어요.'}}function start(words){quiz=[...words].filter(w=>w.en&&w.ko).sort(()=>Math.random()-.5);if(!quiz.length)return alert('단어가 없습니다.');idx=0;correct=0;miss=[];feedback=false;show('quiz');nextView()}function nextView(){if(idx>=quiz.length){$('resultText').textContent=`${correct} / ${quiz.length} 정답` ;show('result');return}feedback=false;activeWord=quiz[idx].en;$('quizMeaning').textContent=quiz[idx].ko;$('quizCount').textContent=`${idx+1} / ${quiz.length}`;$('progressBar').style.width=(idx/quiz.length*100)+'%';$('quizAnswer').value='';$('quizAnswer').disabled=false;$('answerForm').classList.remove('hidden');$('feedback').classList.add('hidden');$('speechMessage').textContent='';$('quizAnswer').focus()}$('answerForm').addEventListener('submit',e=>{e.preventDefault();if(feedback)return;const answer=$('quizAnswer').value;if(!answer.trim())return;feedback=true;let ok=norm(answer)===norm(activeWord);if(ok)correct++;else miss.push(activeWord);$('answerResult').innerHTML=ok?'<strong class="good">정답! 🎉</strong>':'<strong class="bad">아쉬워요</strong>';$('correctWord').textContent='정답: '+activeWord;$('answerForm').classList.add('hidden');$('feedback').classList.remove('hidden');if(auto)speak(activeWord)});$('nextBtn').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();idx++;nextView()};$('replayBtn').onclick=()=>speak(activeWord);$('autoBtn').onclick=()=>{auto=!auto;$('autoBtn').textContent=auto?'🔊 자동 ON':'🔇 자동 OFF';if(!auto&&'speechSynthesis'in window)speechSynthesis.cancel()};$('quizExit').onclick=()=>{if('speechSynthesis'in window)speechSynthesis.cancel();show('home')};$('resultHome').onclick=()=>show('home');$('retryBtn').onclick=()=>start(quiz);$('manualBtn').onclick=()=>edit(null);$('sampleBtn').onclick=()=>edit({title:'예제 단어장',words:[{en:'apple',ko:'사과'},{en:'attentive',ko:'주의 깊은'},{en:'consider',ko:'고려하다'},{en:'achieve',ko:'달성하다'}]});$('editorBack').onclick=()=>show('home');$('saveBook').onclick=()=>{if(save())show('home')};$('startFromEdit').onclick=()=>{const b=save();if(b)start(b.words)};$('backupBtn').onclick=()=>download('단어콕_전체백업.json',{format:'wordkok-standalone',books});$('jsonFile').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;try{importData(JSON.parse(await f.text()))}catch(err){alert('가져오기 실패: '+err.message)}e.target.value=''};if('speechSynthesis'in window){voices();speechSynthesis.addEventListener?.('voiceschanged',voices)}load()})();
</script></body></html>
